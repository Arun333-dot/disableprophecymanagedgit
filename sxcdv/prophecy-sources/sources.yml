---
version: 2
sources:
- name: "hive_metastore.rohit"
  database: "hive_metastore"
  schema: "rohit"
  config:
    enabled: true
  tables:
  - name: "databricks_large"
    description: "Employee data encompassing personal details, professional experience,\
      \ and interests, aiding in workforce analysis and management."
    quoting:
      identifier: true
    columns:
    - name: "age"
      description: "The age of the individual"
      dataType:
        type: "Bigint"
    - name: "department"
      description: "The department where the employee works"
      dataType:
        type: "String"
    - name: "experience_years"
      description: "Number of years of professional experience"
      dataType:
        type: "Bigint"
    - name: "hobbies"
      description: "List of hobbies associated with the individual"
      dataType:
        type: "Array"
        dataType:
          type: "String"
    - name: "id"
      description: "Unique identifier for each individual in the dataset"
      dataType:
        type: "Bigint"
    - name: "name"
      description: "The name of the individual"
      dataType:
        type: "String"
    - name: "nested_array"
      description: "A collection of grouped hobbies or interests."
      dataType:
        type: "Array"
        dataType:
          type: "Array"
          dataType:
            type: "String"
    - name: "salary"
      description: "The annual salary of the employee"
      dataType:
        type: "Double"
